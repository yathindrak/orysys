services:
  api:
    environment:
      ORYSYS_ENVIRONMENT: production
      ORYSYS_USE_FAKE_ADAPTERS: "false"
      ORYSYS_AUTH_ENABLED: "true"
      DATABASE_URL: postgresql://orysys:local-postgres-change-me@postgres:5432/orysys
      REDIS_URL: redis://redis:6379/0
      ORYSYS_MCP_SERVER_URL: http://mcp-server:8001/mcp
      ORYSYS_ALLOWED_OUTBOUND_HOSTS: 127.0.0.1,localhost,mcp-server
      ORYSYS_ALLOWED_INSECURE_OUTBOUND_HOSTS: 127.0.0.1,localhost,mcp-server
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-default}
      CLOUDFLARE_EMBEDDING_MODEL: ${CLOUDFLARE_EMBEDDING_MODEL:-@cf/qwen/qwen3-embedding-0.6b}
      CLOUDFLARE_EMBEDDING_DIMENSIONS: ${CLOUDFLARE_EMBEDDING_DIMENSIONS:-1024}
      CLOUDFLARE_CHAT_MODEL: ${CLOUDFLARE_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      CLOUDFLARE_CHAT_MAX_TOKENS: ${CLOUDFLARE_CHAT_MAX_TOKENS:-4096}
      PINECONE_API_KEY: ${PINECONE_API_KEY:?set PINECONE_API_KEY in .env}
      PINECONE_INDEX: ${PINECONE_INDEX:?set PINECONE_INDEX in .env}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-orysys-compose}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER in .env}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-orysys-api}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-orysys-api}

  ui:
    environment:
      ORYSYS_AUTH_ENABLED: "true"
