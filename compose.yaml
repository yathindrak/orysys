x-app-environment: &app-environment
  ORYSYS_ENVIRONMENT: ${ORYSYS_COMPOSE_ENVIRONMENT:-development}
  ORYSYS_USE_FAKE_ADAPTERS: ${ORYSYS_COMPOSE_USE_FAKE_ADAPTERS:-true}
  ORYSYS_AUTH_ENABLED: ${ORYSYS_COMPOSE_AUTH_ENABLED:-false}
  DATABASE_URL: postgresql://orysys:local-postgres-change-me@postgres:5432/orysys
  REDIS_URL: redis://redis:6379/0
  ORYSYS_MCP_SERVER_URL: http://mcp-server:8001/mcp
  ORYSYS_ALLOWED_OUTBOUND_HOSTS: 127.0.0.1,localhost,mcp-server
  ORYSYS_ALLOWED_INSECURE_OUTBOUND_HOSTS: 127.0.0.1,localhost,mcp-server
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: orysys
      POSTGRES_USER: orysys
      POSTGRES_PASSWORD: local-postgres-change-me
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - orysys-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orysys -d orysys"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orysys-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      target: runtime
    image: orysys:local
    command: ["python", "-m", "orysys.mcp_server.app"]
    init: true
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: orysys:local
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn orysys.api.app:create_app --factory --host 0.0.0.0 --port 8000
    environment: *app-environment
    init: true
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ui:
    image: orysys:local
    command: ["streamlit", "run", "src/orysys/ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      ORYSYS_API_URL: http://api:8000
      ORYSYS_AUTH_ENABLED: ${ORYSYS_COMPOSE_AUTH_ENABLED:-false}
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./.streamlit:/home/orysys/.streamlit:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    profiles: [identity]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak/orysys-realm.json:/opt/keycloak/data/import/orysys-realm.json:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  orysys-postgres:
  orysys-redis:
