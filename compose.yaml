services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: orysys
      POSTGRES_USER: orysys
      POSTGRES_PASSWORD: local-postgres-change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orysys-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orysys -d orysys"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    profiles: ["identity"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak/orysys-realm.json:/opt/keycloak/data/import/orysys-realm.json:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orysys-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  orysys-postgres:
  orysys-redis:
