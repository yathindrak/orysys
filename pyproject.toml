[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orysys"
version = "0.1.0"
description = "Access-scoped enterprise knowledge assistant"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "langgraph>=1.2,<2",
  "langsmith>=0.4,<1",
  "pinecone>=10,<11",
  "pinecone-text>=0.11,<0.12",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
  "structlog>=25,<26",
  "streamlit[auth]>=1.63,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orysys"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["orysys"]

[[tool.mypy.overrides]]
module = ["pinecone_text.*"]
ignore_missing_imports = true
